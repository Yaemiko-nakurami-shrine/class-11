<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro de Cliente</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Cadastro de Cliente</h1>
    
    <form action="#" method="post" class="form-cadastro">
      <div class="form-group">
        <label for="nome">Nome completo *</label>
        <input 
          type="text" 
          id="nome" 
          name="nome" 
          placeholder="Digite seu nome" 
          required 
          minlength="3"
        >
      </div>

      <div class="form-group">
        <label for="email">E-mail *</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="exemplo@dominio.com" 
          required
        >
      </div>

      <div class="form-group">
        <label for="telefone">Telefone / WhatsApp</label>
        <input 
          type="tel" 
          id="telefone" 
          name="telefone" 
          placeholder="(41) 99999-9999" 
          pattern="\[0-9]{2}\ [0-9]{4,5}-[0-9]{4}"
        >
      </div>

      <div class="form-group">
        <label for="cpf">CPF</label>
        <input 
          type="text" 
          id="cpf" 
          name="cpf" 
          placeholder="000.000.000-00" 
          pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
        >
      </div>

      <div class="form-group">
        <label for="data-nascimento">Data de Nascimento</label>
        <input type="date" id="data-nascimento" name="data-nascimento">
      </div>

      <div class="form-group">
        <label for="senha">Senha *</label>
        <input 
          type="password" 
          id="senha" 
          name="senha" 
          placeholder="Mínimo 6 caracteres" 
          required 
          minlength="6"
        >
      </div>

      <button type="submit">Cadastrar Cliente</button>
    </form>

    <p class="info">* Campos obrigatórios</p>
  </div>

  <!-- 
    Observação: Este formulário NÃO envia dados para lugar nenhum (GitHub Pages é estático).
    Para salvar de verdade você precisaria de backend (Firebase, Formspree, Google Sheets + script, etc.)
  -->
</body>
</html>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cleave.js/1.6.0/cleave.min.js"></script>
<script>
  new Cleave('#cpf', { blocks: [3,3,3,2], delimiters: ['.','.','-'] });
  new Cleave('#telefone', { blocks: [0,2,0,4,4], delimiters: ['(',') ','-'], numericOnly: true });
</script>
